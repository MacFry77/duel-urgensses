services:
  - type: web
    name: duel-urgensses
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm install
    startCommand: node security-proxy.js
    healthCheckPath: /
    envVars:
      - key: INTERNAL_PORT
        value: 3100
      - key: PUBLIC_ORIGIN
        value: https://duel-urgensses.onrender.com
      - key: ADMIN_USER
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_SUBJECT
        value: https://duel-urgensses.onrender.com/
